name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yml"
      - "app/**"
      - "components/**"
      - "data/**"
      - "packages/**"
      - "patches/**"
      - "public/**"
      - "fastlane/**"
      - "ios/**"
      - "app.json"
      - "Gemfile*"
      - "mise.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# API base baked into the JS bundle by the metro import-meta-env plugin.
env:
  ONE_PUBLIC_API_URL: https://karro-api.josocjoq-dev.workers.dev

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CI: "1"
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Apple secrets
        run: |
          missing=()
          for var in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!var}" ]; then missing+=("$var"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo "See fastlane/DEPLOY.md for how to mint and add them."
            exit 1
          fi
          echo "All Apple secrets present."

      - name: Install toolchain (node/pnpm via mise.toml)
        uses: jdx/mise-action@v2

      - name: Locate pnpm store
        run: echo "PNPM_STORE=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ios/ is gitignored and regenerated by `one prebuild` (expo prebuild).
      # The tarball checkout may carry a stale ios/; a fresh runner has none.
      - name: Generate native project (one prebuild)
        run: |
          pnpm prebuild:native
          # babel/metro configs are generated (gitignored): the Xcode JS-bundle
          # phase needs them; writing at build time keeps `one build` green.
          pnpm exec one metro-eject

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Set up Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true # runs `bundle install`, caches gems keyed on Gemfile.lock

      - name: Archive + upload to TestFlight
        run: bundle exec fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karro-ipa
          path: build/*.ipa
          if-no-files-found: ignore
          retention-days: 14
