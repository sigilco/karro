# Android CI — builds the debug APK and release AAB, uploads them as artifacts,
# and (when configured) pushes the AAB to the Google Play internal track.
#
# Required GitHub Actions secrets for the play-internal job
# (Settings -> Secrets and variables -> Actions):
#
#   PLAY_SERVICE_ACCOUNT_JSON
#     Contents of a Google Play service-account key JSON (paste the whole file).
#     Create one in Google Cloud Console -> IAM -> Service Accounts, link it in
#     Play Console -> Setup -> API access, and grant "Release apps to testing
#     tracks" (Admin does not need to be granted). When this secret is absent,
#     the play-internal job skips every step and exits green.
#
#   PLAY_PACKAGE_NAME (optional)
#     Application id on Play Console. Defaults to `android.package` in app.json.
#
# Notes:
# - `android/` is generated by `one prebuild` (it is .gitignored). If the
#   checkout already contains android/, prebuild is skipped and ./gradlew runs
#   as-is; otherwise it is regenerated with `one prebuild --platform android`.
# - Gradle resolves Android SDK pieces itself via AGP once platform-tools,
#   cmdline-tools and accepted licenses exist; the sdkmanager call below just
#   front-loads the exact versions the build resolves
#   (platforms;android-37.0, build-tools;37.0.0, ndk;27.1.12297006).
# - If the runner's egress IP is rate-limited by Maven Central (HTTP 429 on
#   dependency downloads), retry the job or add a mirror init script in
#   ~/.gradle/init.d — do not commit mirrors into the repo.

name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install mise tools (node, pnpm, oxlint, ...)
        uses: jdx/mise-action@v3

      - name: Locate pnpm store
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate android/ if absent (prebuild)
        run: |
          if [ ! -f android/gradlew ]; then
            pnpm exec one prebuild --platform android
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: karro-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  play-internal:
    needs: build
    runs-on: ubuntu-latest
    env:
      PLAY_SA_CONFIGURED: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      PLAY_PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v5

      - name: Notice when Play upload is not configured
        if: env.PLAY_SA_CONFIGURED != 'true'
        run: |
          echo '::notice::PLAY_SERVICE_ACCOUNT_JSON secret is not set — skipping Play internal upload. See android/DEPLOY.md.'

      - uses: actions/download-artifact@v4
        if: env.PLAY_SA_CONFIGURED == 'true'
        with:
          name: karro-android
          path: dist

      - uses: ruby/setup-ruby@v1
        if: env.PLAY_SA_CONFIGURED == 'true'

      - name: Install fastlane
        if: env.PLAY_SA_CONFIGURED == 'true'
        run: gem install fastlane --no-document

      - name: Upload AAB to Play internal track
        if: env.PLAY_SA_CONFIGURED == 'true'
        env:
          PACKAGE_NAME: ${{ env.PLAY_PACKAGE_NAME != '' && env.PLAY_PACKAGE_NAME || 'com.sigilco.karro' }}
        run: |
          fastlane supply \
            --track internal \
            --release_status draft \
            --aab dist/app-release.aab \
            --package_name "$PACKAGE_NAME" \
            --json_key_data "$PLAY_SERVICE_ACCOUNT_JSON" \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots
